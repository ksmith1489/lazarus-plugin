[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Failed-Print-Resume-Wizard"
version = "1.0.0"
description = "Failed Print Resume Wizard helps recover failed prints while the partial print is still on the bed."
authors = [
    {name = "Kenneth B Smith", email = "failed.print.resume.wizard@proton.me"}
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7, <4"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
include = [
    "octoprint_lazarus",
    "octoprint_lazarus.*",
]

[tool.setuptools.package-data]
octoprint_lazarus = [
    "templates/*.jinja2",
    "static/**/*",
]

[project.entry-points."octoprint.plugin"]
lazarus = "octoprint_lazarus"

[project.urls]
Homepage = "https://wizard.lazarus3dprint.com"
Source = "https://github.com/ksmith1489/lazarus-plugin"
Documentation = "https://wizard.lazarus3dprint.com/activate"
