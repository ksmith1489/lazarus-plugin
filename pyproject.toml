[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-3DPrintSaver"
version = "2.0.2"
description = "3DPrintSaver.com recovers failed prints that are still attached or must be re-seated on the bed."
authors = [
    {name = "Kenneth B Smith", email = "Ken@3dprintsaver.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7, <4"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
include = [
    "octoprint_lazarus",
    "octoprint_lazarus.*",
]

[tool.setuptools.package-data]
octoprint_lazarus = [
    "templates/*.jinja2",
    "static/**/*",
]

[project.entry-points."octoprint.plugin"]
lazarus = "octoprint_lazarus"

[project.urls]
Homepage = "https://3dprintsaver.com"
Source = "https://github.com/ksmith1489/lazarus-plugin"
Documentation = "https://3dprintsaver.com/install"
