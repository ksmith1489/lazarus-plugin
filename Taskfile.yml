version: "3"

tasks:
  test:
    desc: Run the 3DPrintSaver.com resume engine regression tests
    cmds:
      - python3 -m unittest tests.test_resume_engine

  compile:
    desc: Compile the plugin package to catch syntax issues
    cmds:
      - python3 -m compileall octoprint_lazarus

  package:
    desc: Build the versioned OctoPrint source package on Windows
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-plugin.ps1

  clean:
    desc: Remove local Python cache directories
    cmds:
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
